<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head> 
<body bgcolor="lightcoral"> 
    <h1> Registration Form</h1>
    <form action="#"method="post">
        <fieldset>personal information
<label for="name">Student Name:</label>
<input type="text" id="name" name="name" required placeholder="Enter your name"><br><br> 
<label for="email">Email:</label>
<input type="email" id="email" name="email" required placeholder="Enter your email"><br><br>
<label for="password">Password:</label>

<input type="password" id="password" name="password" required placeholder="Enter your password" required><br><br>
</fieldset>
<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone" required placeholder="Enter your phone number"><br><br>
<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob" required><br><br>    
<label for="address">Address:</label>
<textarea id="address" name="address" rows="4" cols="50" required placeholder   ="Enter your address"></textarea><br><br>
<label for="course">Course:</label>
<select id="course" name="course" required> 
    <option value="">Select Course</option>
    <option value="bca">BCA</option>
    <option value="bsc">BSC</option>
    <option value="bcom">BCOM</option>
    <option value="ba">BA</option>
</select><br><br>
<label for="gender">Gender:</label>
<select id="gender" name="gender" required>
    <option value="">Select Gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
</select><br><br> 
<input type="radio"
value=" MALE"> male
<input type="radio" 
value="FEMALE"> female

    </form>
<body>
</html>
