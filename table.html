<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h2>HTML TABLE TAG EXAMPLE</h2>
   <table border="6">
    <caption>
    Students marks </caption>
    <colgroup>
        <col span="1" style="background-color:rgb(179, 139, 142)">
        <col span="1" style="background-color:rgb(132, 171, 184)">
        <col span="1" style="background-color:rgb(182, 195, 163)">
      </colgroup>
    <thead>

<tbody>


    
   <tr>
<th>Student Name</th>
<th>Subject</th>    
<th>Marks</th>
</tr>
</tr>
<tr>
<td rowspan="2">John</td>
<td>Maths</td>      
<td>90</td>


</tr>
<tr>

<td>physics</td>      
<td>99</td>


</tr>
<tr>
<td rowspan="2">rohit</td>
<td>Maths</td>      
<td>80</td>


</tr>
<tr>

<td>hindi</td>      
<td>50</td>


</tr>
</tbody>

<tfoot>


<tr>
<td colspan="2">Total Students</td>

<td>2 </td>

</tr>
</tfoot>
   </table>

</body>
</html>
