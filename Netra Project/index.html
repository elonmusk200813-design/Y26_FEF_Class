<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        header{
            background: linear-gradient(90deg, #0a192f, #112240);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-section{
            display: flex;
            align-items: center;
        }

        .logo{
            width: 60px;
            height: 60px;
            margin-right: 15px;
        }

        .title h1{
            font-size: 28px;
            color: #64ffda;
        }

        .title p{
            font-size: 14px;
            color: #ccd6f6;
        }

        .status{
            background-color: #28a745;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <img src="Screenshot 2026-11-16 124736.png" alt="NETRA Logo" class="logo">

        <div class="title">
            <h1>NETRA</h1>
            <p>Robot Monitoring Control</p>
        </div>
    </div>

    <div class="status">
    </div>
</header>

</body>
</html>
